name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      # Full history: the clippy ratchet compares against the merge base with main.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-machete

      # taiki-e ships cargo-vet only up to 0.10.0, whose store formatting differs from
      # the 0.10.2 that wrote supply-chain/ (and that the local hook runs), so pin the
      # crates.io build and cache it.
      - name: Cache cargo-vet
        id: cargo-vet-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo-tools
          key: cargo-vet-0.10.2-${{ runner.os }}

      - name: Install cargo-vet 0.10.2
        if: steps.cargo-vet-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --root ~/.cargo-tools cargo-vet@0.10.2

      - run: echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      # The server embeds web/dist via rust-embed, so the frontend must exist before
      # anything Rust is compiled — including the tests.
      - name: Build frontend
        working-directory: web
        run: npm run build

      # The same targets the Stop hook runs through `make gate`; see the Makefile.
      - name: Format
        run: make fmt

      # Every lint fatal, except arithmetic_side_effects and indexing_slicing, which
      # fail only on the lines a branch touches.
      - name: Clippy (ratcheted)
        run: make lint

      - name: Tests (nextest + doctests + API bindings)
        env:
          NEXTEST_PROFILE: ci
        run: make test

      # `make test` regenerates the TypeScript API bindings from the Rust types. If the
      # committed copy differs, the frontend is compiling against a contract the server no
      # longer serves — so fail rather than let the two drift apart silently.
      - name: API bindings are in sync
        run: git diff --exit-code -- web/src/api/types.ts

      - name: cargo vet
        run: make vet

      - name: cargo machete
        run: make machete

      # Compiled, not run: timings on a shared runner mean nothing, but a bench that no
      # longer builds is found here rather than the next time someone wants numbers.
      - name: Benchmarks compile
        run: make bench-build

      - name: Typecheck frontend
        working-directory: web
        run: npx tsc --noEmit

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      # The image, PDF and DOCX fixtures are written byte by byte; this proves they are
      # still valid files rather than plausible-looking rubbish.
      - name: Verify test fixtures
        run: python3 test/fixtures/verify_fixtures.py

      # WebKit as well as chromium, and deliberately: the phone projects emulate an
      # iPhone, and Playwright runs those on WebKit. Installing chromium alone left them
      # launching a browser that was not there — which passed locally, on a machine that
      # happened to have WebKit from an earlier install, and failed here. Firefox is not
      # installed because nothing targets it.
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium webkit

      # Drives the real binary serving the real embedded frontend, against copies of the
      # fixtures in a scratch directory — see test/e2e/run-server.sh.
      - name: End-to-end tests
        working-directory: web
        run: npm run e2e

      - name: Upload e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      # A test that writes must do so in the scratch copies. If the checkout moved, the
      # isolation the suite depends on has broken and every later run is suspect.
      - name: Fixtures survived the e2e run untouched
        run: git diff --exit-code -- test/fixtures/

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked

  mutants:
    name: cargo-mutants on the PR diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The server embeds web/dist, so every mutant build needs it, as the test job does.
      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

      - name: Diff against the base branch
        run: git diff "origin/${GITHUB_BASE_REF}...HEAD" > "$RUNNER_TEMP/pr.diff"

      - name: Mutants that no test catches fail the PR
        run: cargo mutants --in-place --no-shuffle --in-diff "$RUNNER_TEMP/pr.diff"

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mutants.out
          path: mutants.out
          retention-days: 14

  publish:
    name: Publish container image
    needs: [test, deny]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: cross

      # zig supplies the cross-linker, so both targets compile at native speed on this
      # x86 runner instead of under emulation. cargo-auditable embeds the dependency
      # list in each binary, so `cargo audit bin` can check a deployed one later.
      - name: Install cross toolchain
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild cargo-auditable

      - name: Cross-compile both architectures
        run: |
          cargo auditable zigbuild --release --locked -p kbviewer-server \
            --target x86_64-unknown-linux-musl \
            --target aarch64-unknown-linux-musl
          mkdir -p dist/amd64 dist/arm64
          cp target/x86_64-unknown-linux-musl/release/kbviewer dist/amd64/kbviewer
          cp target/aarch64-unknown-linux-musl/release/kbviewer dist/arm64/kbviewer

      # Prove what was produced before shipping it: a dynamically linked binary would
      # fail at runtime on alpine, and a wrong-architecture one fails on the NAS.
      - name: Verify the binaries
        run: |
          file dist/amd64/kbviewer dist/arm64/kbviewer
          file dist/amd64/kbviewer | grep -q 'x86-64'
          file dist/arm64/kbviewer | grep -q 'aarch64'
          file dist/amd64/kbviewer | grep -q 'static'

      # Only the tiny `apk add` layer is emulated; nothing is compiled here.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
