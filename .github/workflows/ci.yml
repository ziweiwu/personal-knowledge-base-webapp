name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      # The server embeds web/dist via rust-embed, so the frontend must exist before
      # anything Rust is compiled — including the tests.
      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # `cargo test` regenerates the TypeScript API bindings from the Rust types. If the
      # committed copy differs, the frontend is compiling against a contract the server no
      # longer serves — so fail rather than let the two drift apart silently.
      - name: API bindings are in sync
        run: git diff --exit-code -- web/src/api/types.ts

      - name: Typecheck frontend
        working-directory: web
        run: npx tsc --noEmit

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      # The image, PDF and DOCX fixtures are written byte by byte; this proves they are
      # still valid files rather than plausible-looking rubbish.
      - name: Verify test fixtures
        run: python3 test/fixtures/verify_fixtures.py

  publish:
    name: Publish container image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: cross

      # zig supplies the cross-linker, so both targets compile at native speed on this
      # x86 runner instead of under emulation.
      - name: Install cross toolchain
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild

      - name: Cross-compile both architectures
        run: |
          cargo zigbuild --release --locked -p kbview-server \
            --target x86_64-unknown-linux-musl \
            --target aarch64-unknown-linux-musl
          mkdir -p dist/amd64 dist/arm64
          cp target/x86_64-unknown-linux-musl/release/kbview dist/amd64/kbview
          cp target/aarch64-unknown-linux-musl/release/kbview dist/arm64/kbview

      # Prove what was produced before shipping it: a dynamically linked binary would
      # fail at runtime on alpine, and a wrong-architecture one fails on the NAS.
      - name: Verify the binaries
        run: |
          file dist/amd64/kbview dist/arm64/kbview
          file dist/amd64/kbview | grep -q 'x86-64'
          file dist/arm64/kbview | grep -q 'aarch64'
          file dist/amd64/kbview | grep -q 'static'

      # Only the tiny `apk add` layer is emulated; nothing is compiled here.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
