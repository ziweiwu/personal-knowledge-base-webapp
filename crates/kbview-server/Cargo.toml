[package]
name = "kbview-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kbview_server"
path = "src/lib.rs"

[[bin]]
name = "kbview"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
comrak = "0.54.0"
dashmap = "6.2.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
kbview-core = { path = "../kbview-core" }
kbview-docx = { path = "../kbview-docx" }
latex2mathml = "0.2.3"
mime_guess = "2.0.5"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
rpassword = "7.5.4"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
syntect = "5.3.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "compression-gzip", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
http-body-util = "0.1.5"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
tower = { version = "0.5.3", features = ["util"] }
